<app-navbar></app-navbar>
<router-outlet></router-outlet>

<section class="min-h-screen bg-[#111440] text-[#BDF2F2] py-16 px-6">
  <h2 class="text-4xl font-bold text-center mb-4">Películas Populares</h2>
  <p class="text-center text-[#BDF2F2]/80 mb-10 max-w-3xl mx-auto">
    Explora las películas más vistas y mejor valoradas del momento.
    Filtra por nombre o rango de fechas y descubre nuevas joyas del cine.
  </p>

  <div class="flex flex-wrap justify-center gap-4 mb-10">
    <input
      type="text"
      [(ngModel)]="query"
      placeholder="Buscar por nombre..."
      class="px-4 py-2 rounded-lg bg-[#1F2373]/70 border border-[#343BBF]/60 focus:ring-2 focus:ring-[#BDF2F2] outline-none"
    />
    <input
      type="date"
      [(ngModel)]="startDate"
      class="px-3 py-2 rounded-lg bg-[#1F2373]/70 border border-[#343BBF]/60 focus:ring-2 focus:ring-[#BDF2F2] outline-none"
    />
    <input
      type="date"
      [(ngModel)]="endDate"
      class="px-3 py-2 rounded-lg bg-[#1F2373]/70 border border-[#343BBF]/60 focus:ring-2 focus:ring-[#BDF2F2] outline-none"
    />
    <button
      (click)="buscar()"
      class="bg-[#343BBF] hover:bg-[#2D33A6] text-[#BDF2F2] px-6 py-2 rounded-lg transition-all duration-300"
    >
      Filtrar
    </button>
  </div>

  <div
    class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 max-w-7xl mx-auto"
  >
    <div
      *ngFor="let peli of peliculas"
      (click)="verDetalle(peli.id)"
      class="cursor-pointer bg-[#1F2373]/70 rounded-2xl shadow-lg overflow-hidden hover:scale-105 hover:shadow-[#343BBF]/40 transition-all group relative"
    >
      <img
        [src]="'https://image.tmdb.org/t/p/w500' + peli.poster_path"
        [alt]="peli.title"
        class="w-full h-[400px] object-cover transition-transform duration-500 group-hover:scale-105"
      />
      <div
        class="absolute inset-0 bg-gradient-to-t from-[#111440]/80 via-transparent to-transparent opacity-70 group-hover:opacity-90 transition-all"
      ></div>
      <div class="absolute bottom-4 left-0 w-full text-center">
        <h3 class="text-lg font-bold text-[#BDF2F2]">
          {{ peli.title }}
        </h3>
        <p class="text-sm text-[#BDF2F2]/80">
          ⭐ {{ peli.vote_average | number: '1.1-1' }}
        </p>
      </div>
    </div>
  </div>

  <div *ngIf="cargando" class="text-center mt-10">
    <div
      class="w-10 h-10 border-4 border-[#BDF2F2]/40 border-t-[#BDF2F2] rounded-full animate-spin mx-auto mb-2"
    ></div>
    <p class="text-[#BDF2F2]/70">Cargando más películas...</p>
  </div>
</section>

<app-footer></app-footer>
